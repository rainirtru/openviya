name: openviya-ops-lan

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openviya_ops
      POSTGRES_USER: openviya_ops
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openviya_ops -d openviya_ops"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - backend

  server:
    build:
      context: ../..
      dockerfile: ops/lan/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      OPENVIYA_OPS_TOKEN_FILE: /run/secrets/ops_token
      OPENVIYA_OPS_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      OPENVIYA_OPS_DB_CONNECTION_STRING_FILE: /run/secrets/db_connection_string
    secrets:
      - ops_token
      - encryption_key
      - db_connection_string
    tmpfs:
      - /tmp:mode=0700,uid=1654,gid=1654
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - egress

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${LAN_BIND_IP:?Run bootstrap.ps1 first}:8444:8444"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - server
    networks:
      - backend

secrets:
  postgres_password:
    file: .secrets/postgres_password
  ops_token:
    file: .secrets/ops_token
  encryption_key:
    file: .secrets/encryption_key
  db_connection_string:
    file: .secrets/db_connection_string

volumes:
  postgres_data:

networks:
  backend:
    internal: true
  egress: {}
