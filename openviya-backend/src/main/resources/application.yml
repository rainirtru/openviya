spring:
  application:
    name: openviya-backend
  datasource:
    url: ${OPENVIYA_DB_URL:jdbc:postgresql://localhost:5432/openviya}
    username: ${OPENVIYA_DB_USERNAME:openviya}
    password: ${OPENVIYA_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${OPENVIYA_DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    enabled: true
    validate-on-migrate: true
  session:
    timeout: ${OPENVIYA_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  servlet:
    session:
      cookie:
        name: OPENVIYA_SESSION
        path: /api/v1
        http-only: true
        secure: ${OPENVIYA_SESSION_COOKIE_SECURE:true}
        same-site: lax
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false

openviya:
  public-base-url: ${OPENVIYA_PUBLIC_BASE_URL:http://localhost:8080}
  auth:
    challenge-lifetime: ${OPENVIYA_AUTH_CHALLENGE_LIFETIME:5m}
    totp-encryption-key: ${OPENVIYA_TOTP_ENCRYPTION_KEY:}
    totp-encryption-key-version: ${OPENVIYA_TOTP_ENCRYPTION_KEY_VERSION:v1}
    bootstrap-owner:
      enabled: ${OPENVIYA_BOOTSTRAP_OWNER_ENABLED:false}
      login: ${OPENVIYA_BOOTSTRAP_OWNER_LOGIN:}
      password: ${OPENVIYA_BOOTSTRAP_OWNER_PASSWORD:}
  queue:
    poll-interval: ${OPENVIYA_QUEUE_POLL_INTERVAL:1s}
    batch-size: ${OPENVIYA_QUEUE_BATCH_SIZE:20}
    lease-duration: ${OPENVIYA_QUEUE_LEASE_DURATION:30s}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:--}]"
