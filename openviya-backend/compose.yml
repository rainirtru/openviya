services:
  db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${OPENVIYA_DB_NAME:-openviya}
      POSTGRES_USER: ${OPENVIYA_DB_USERNAME:-openviya}
      POSTGRES_PASSWORD: ${OPENVIYA_DB_PASSWORD:?Set OPENVIYA_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENVIYA_DB_URL: jdbc:postgresql://db:5432/${OPENVIYA_DB_NAME:-openviya}
      OPENVIYA_DB_USERNAME: ${OPENVIYA_DB_USERNAME:-openviya}
      OPENVIYA_DB_PASSWORD: ${OPENVIYA_DB_PASSWORD:?Set OPENVIYA_DB_PASSWORD in .env}
      OPENVIYA_DB_POOL_SIZE: ${OPENVIYA_DB_POOL_SIZE:-10}
      SERVER_PORT: 8080
      OPENVIYA_SESSION_COOKIE_SECURE: ${OPENVIYA_SESSION_COOKIE_SECURE:-true}
      OPENVIYA_SESSION_TIMEOUT: ${OPENVIYA_SESSION_TIMEOUT:-30m}
      OPENVIYA_TOTP_ENCRYPTION_KEY: ${OPENVIYA_TOTP_ENCRYPTION_KEY:-}
      OPENVIYA_TOTP_ENCRYPTION_KEY_VERSION: ${OPENVIYA_TOTP_ENCRYPTION_KEY_VERSION:-v1}
      OPENVIYA_AUTH_CHALLENGE_LIFETIME: ${OPENVIYA_AUTH_CHALLENGE_LIFETIME:-5m}
      OPENVIYA_BOOTSTRAP_OWNER_ENABLED: ${OPENVIYA_BOOTSTRAP_OWNER_ENABLED:-false}
      OPENVIYA_BOOTSTRAP_OWNER_LOGIN: ${OPENVIYA_BOOTSTRAP_OWNER_LOGIN:-}
      OPENVIYA_BOOTSTRAP_OWNER_PASSWORD: ${OPENVIYA_BOOTSTRAP_OWNER_PASSWORD:-}
      OPENVIYA_OWNER_RECOVERY_ENABLED: ${OPENVIYA_OWNER_RECOVERY_ENABLED:-false}
      OPENVIYA_OWNER_RECOVERY_LOGIN: ${OPENVIYA_OWNER_RECOVERY_LOGIN:-}
      OPENVIYA_OWNER_RECOVERY_PASSWORD: ${OPENVIYA_OWNER_RECOVERY_PASSWORD:-}
      OPENVIYA_PUBLIC_BASE_URL: ${OPENVIYA_PUBLIC_BASE_URL:-http://localhost:8080}
      OPENVIYA_QUEUE_POLL_INTERVAL: ${OPENVIYA_QUEUE_POLL_INTERVAL:-1s}
      OPENVIYA_QUEUE_BATCH_SIZE: ${OPENVIYA_QUEUE_BATCH_SIZE:-20}
      OPENVIYA_QUEUE_LEASE_DURATION: ${OPENVIYA_QUEUE_LEASE_DURATION:-30s}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
